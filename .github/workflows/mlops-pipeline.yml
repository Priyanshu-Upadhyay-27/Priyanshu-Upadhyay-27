name: Generate MLOps Pipeline Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs every midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate MLOps SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_pipeline.py

      - name: Commit and Push to Output Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b output || git checkout output
          git add mlops-pipeline.svg
          git commit -m "Update MLOps Pipeline Animation" || echo "No changes to commit"
          git push -f origin output
